apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: victoria-metrics
  namespace: flux-system
spec:
  interval: 12h
  type: oci
  url: oci://ghcr.io/victoriametrics/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmks
  namespace: flux-system
spec:
  targetNamespace: monitoring
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.98.1" # {"$imagepolicy": "flux-system:vmks:tag"}
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
      interval: 12h
  install:
    crds: Create
    timeout: 9m
  upgrade:
    crds: CreateReplace
    timeout: 9m
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: flux-kube-state-metrics-config
  values:
    nameOverride: "vmks"
    global:
      clusterLabel: cluster
      cluster:
        dnsDomain: cluster.local

    prometheus-operator-crds:
      enabled: true
    victoria-metrics-operator:
      enabled: true
      serviceMonitor:
        enabled: true
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    vmsingle:
      enabled: true

    grafana:
      enabled: true
      envFromSecret: grafana-oidc
      grafana.ini:
        server:
          root_url: https://grafana.${PRIVATE_DOMAIN}
        auth.generic_oauth:
          enabled: true
          name: Authelia
          icon: signin
          client_id: grafana
          scopes: openid profile email groups
          empty_scopes: false
          auth_url: https://auth.${PRIVATE_DOMAIN}/api/oidc/authorization
          token_url: https://auth.${PRIVATE_DOMAIN}/api/oidc/token
          api_url: https://auth.${PRIVATE_DOMAIN}/api/oidc/userinfo
          login_attribute_path: preferred_username
          groups_attribute_path: groups
          name_attribute_path: name
          use_pkce: true
          auth_style: InHeader
          role_attribute_path: "contains(groups[*], 'lldap_admin') && 'Admin' || 'Viewer'"
          auto_login: true
      route:
        main:
          enabled: true
          parentRefs:
            - name: private-gateway
              namespace: envoy-gateway-system
          hostnames:
            - grafana.${PRIVATE_DOMAIN}
      sidecar:
        dashboards:
          provider:
            name: default
            orgId: 1
            allowUiUpdates: true
            foldersFromFilesStructure: true
          folder: /var/lib/grafana/dashboards
          defaultFolderName: default
          enabled: true
          multicluster: false
          label: grafana_dashboard
          labelValue: "1"
          folderAnnotation: "grafana_folder"

    defaultDashboards:
      enabled: true
      defaultTimezone: ${TIMEZONE}

    prometheus-node-exporter:
      # nixos-worker-01's appdata-usage service writes the app volume sizes there
      extraArgs:
        - --collector.textfile.directory=/host/root/var/lib/node-exporter-textfile
      service:
        port: 9022
        targetPort: metrics
      vmScrape:
        enabled: true

    alertmanager:
      spec:
        secrets:
          - alertmanager-notifications
      config:
        route:
          receiver: blackhole
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 24h
          routes:
            # Always firing: healthchecks.io alerts when these pings stop, i.e. when the cluster,
            # its monitoring or the internet is down and no other alert could get out
            - matchers: [alertname="Watchdog"]
              receiver: healthchecks
              group_wait: 0s
              group_interval: 1m
              repeat_interval: 1m
            - matchers: [severity=~"warning|critical"]
              receiver: email
        inhibit_rules:
          - source_matchers: [severity="critical"]
            target_matchers: [severity="warning"]
            equal: [alertname, namespace]
        receivers:
          - name: blackhole
          - name: email
            email_configs:
              - to: guillaume@${EXTERNAL_DOMAIN}
                from: alerts@${EXTERNAL_DOMAIN}
                smarthost: smtp.migadu.com:465
                auth_username: alerts@${EXTERNAL_DOMAIN}
                auth_password_file: /etc/vm/secrets/alertmanager-notifications/smtp-password
                send_resolved: true
          - name: healthchecks
            webhook_configs:
              - url_file: /etc/vm/secrets/alertmanager-notifications/healthchecks-url
                send_resolved: false
