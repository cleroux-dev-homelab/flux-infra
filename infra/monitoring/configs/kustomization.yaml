apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - ./hosts/calcifer
  - ./hosts/nixos-worker-01
  - ./hosts/totoro
  - ./podmonitor.yaml

configMapGenerator:
  - name: flux-grafana-dashboards
    files:
      - ./dashboards/flux/cluster.json
      - ./dashboards/flux/control-plane.json
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: flux
        app.kubernetes.io/component: monitoring
      annotations:
        grafana_folder: "Flux"
        kustomize.toolkit.fluxcd.io/substitute: disabled

  - name: dns-grafana-dashboards
    files:
      - ./dashboards/dns/blocky.json
      - ./dashboards/dns/dnsmasq.json
      - ./dashboards/dns/unbound.json
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: flux
        app.kubernetes.io/component: monitoring
      annotations:
        grafana_folder: "DNS"
        kustomize.toolkit.fluxcd.io/substitute: disabled
