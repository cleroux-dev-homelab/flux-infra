# Disallow pods from talking NFS to totoro themselves.
# Mounts must go through kubelet on the node
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-pods-totoro-nfs
spec:
  endpointSelector: {}
  # A policy with only deny rules otherwise puts every pod in default-deny egress
  enableDefaultDeny:
    egress: false
    ingress: false
  egressDeny:
    - toCIDR:
        - 10.0.0.2/32
        - 2606:6d00:ffb:6600::2/128
      toPorts:
        - ports:
            - port: "2049"
              protocol: TCP
