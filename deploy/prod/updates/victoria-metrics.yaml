---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: vmks
  labels:
    toolkit.fluxcd.io/role: automation
spec:
  image: ghcr.io/victoriametrics/helm-charts/victoria-metrics-k8s-stack
  interval: 1h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: vmks
  labels:
    toolkit.fluxcd.io/role: automation
spec:
  imageRepositoryRef:
    name: vmks
  policy:
    semver:
      range: ">=0.66.0"
