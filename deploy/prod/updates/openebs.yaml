---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: openebs
  labels:
    toolkit.fluxcd.io/role: automation
spec:
  image: ghcr.io/openebs/charts/openebs
  interval: 1h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: openebs
  labels:
    toolkit.fluxcd.io/role: automation
spec:
  imageRepositoryRef:
    name: openebs
  policy:
    semver:
      range: ">=4.4.0"
