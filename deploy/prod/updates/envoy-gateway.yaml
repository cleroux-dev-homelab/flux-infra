---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: envoy-gateway
spec:
  image: "docker.io/envoyproxy/gateway-helm"
  interval: 1h
  provider: generic
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: envoy-gateway
spec:
  imageRepositoryRef:
    name: envoy-gateway
  policy:
    semver:
      range: ">=1.6.0"
