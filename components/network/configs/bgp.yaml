# BGP with calcifer, which routes the LoadBalancer VIPs and the pod /64s to the
# nodes. ASNs are 65000 + VLAN ID: calcifer 65000, the nodes on VLAN 30 65030.
# calcifer accepts only those prefixes and announces nothing back. Cilium itself
# is installed by nixos-config. Design: docs/network.md in flux-fleet.
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: calcifer
spec:
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  bgpInstances:
    - name: homelab
      localASN: 65030
      peers:
        - name: calcifer-v4
          peerASN: 65000
          peerAddress: 10.0.30.1
          peerConfigRef:
            name: calcifer-v4
        - name: calcifer-v6
          peerASN: 65000
          peerAddress: 2606:6d00:ffb:6630::1
          peerConfigRef:
            name: calcifer-v6
---
# One address family per session, matching calcifer's BIRD protocols.
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: calcifer-v4
spec:
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 120
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: calcifer
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: calcifer-v6
spec:
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 120
  families:
    - afi: ipv6
      safi: unicast
      advertisements:
        matchLabels:
          advertise: calcifer
---
# The node's pod CIDRs (calcifer keeps only the IPv6 /64; IPv4 pods are
# masqueraded) and every LoadBalancer IP. Only services matched by a
# CiliumLoadBalancerIPPool get one.
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: calcifer
  labels:
    advertise: calcifer
spec:
  advertisements:
    - advertisementType: PodCIDR
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - { key: homelab.cleroux.dev/no-bgp, operator: DoesNotExist }
