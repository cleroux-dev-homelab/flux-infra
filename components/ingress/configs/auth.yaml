# Login page in front of the private gateway, Authelia and
# LLDAP run on the router. They are reached over the cluster VLAN.
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: authelia
spec:
  endpoints:
    - ip:
        address: 10.0.30.1
        port: 9091
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: lldap
spec:
  endpoints:
    - ip:
        address: 10.0.30.1
        port: 17170
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
spec:
  parentRefs:
    - name: private-gateway
      namespace: envoy-gateway-system
  hostnames:
    - auth.${PRIVATE_DOMAIN}
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: authelia
          port: 9091
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lldap
spec:
  parentRefs:
    - name: private-gateway
      namespace: envoy-gateway-system
  hostnames:
    - lldap.${PRIVATE_DOMAIN}
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: lldap
          port: 17170
---
# Applies to every route on the gateway.
# Fails closed: if Authelia can't be reached, requests get a 403.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private-gateway
  extAuth:
    failOpen: false
    headersToExtAuth:
      - accept
      - cookie
      - authorization
      - proxy-authorization
      - x-forwarded-proto
      - x-forwarded-for
    http:
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: authelia
          port: 9091
      path: /api/authz/ext-authz/
      headersToBackend:
        - Remote-User
        - Remote-Groups
        - Remote-Name
        - Remote-Email
